name: Deploy Fidelity to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Reassemble and unpack the static export
        run: |
          cat fidelity-site.part-* > fidelity-site.zip
          mkdir _site
          unzip -q fidelity-site.zip -d _site
      - name: Add GitHub Pages contact and navigation
        run: |
          mkdir -p _site/interesse
          cp interesse.html _site/interesse/index.html
          cp site-patch.js _site/site-patch.js
          find _site -name "*.html" ! -path "_site/interesse/*" -exec sed -i "s#</body>#<script defer src=\"/site-patch.js\"></script></body>#" {} +
          sed -i "s#https://fidelitiz-mobile-test.el-robino.chatgpt.site/api/contact#/interesse/#g" _site/_next/static/chunks/ContactForm-CJBAP269.js
      - name: Verify route files before publishing
        run: |
          test -s _site/index.html
          test -s _site/tarifs/index.html
          test -s _site/parcours-client/index.html
          test -s _site/interesse/index.html
          grep -q site-patch.js _site/index.html
          ! grep -Rq --include="*.js" chatgpt.site _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
