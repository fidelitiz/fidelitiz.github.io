name: Deploy Fidelity to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Reassemble and unpack the static export
        run: |
          cat fidelity-site.part-* > fidelity-site.zip
          mkdir _site
          unzip -q fidelity-site.zip -d _site
      - name: Verify route files before publishing
        run: |
          test -s _site/index.html
          test -s _site/tarifs/index.html
          test -s _site/parcours-client/index.html
          find _site -maxdepth 2 -type f | sort | head -n 50
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
